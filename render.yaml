# Render blueprint — static site, no build step required.
# The contents of public/ are committed, so Render only has to serve them.
services:
  - type: web
    name: nolmt-website
    runtime: static
    staticPublishPath: ./public
    buildCommand: ""
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /my-nolmt
        destination: /my-nolmt.html
